[project]
name = "homeassistant-zyxel"
version = "0.1.1"
description = "Home Assistant integration for Zyxel routers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2,<3.15"
# the integration has no runtime requirements, see custom_components/zyxel/manifest.json
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "D",    # pydocstyle
]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"conftest.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
